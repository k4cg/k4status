[package]
name = "k4status"
version = "1.5.3"
authors = ["Max <max@karl.wf>"]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/k4cg/k4status"
description = "Space API for K4CG"
keywords = ["spaceapi", "hackspace", "k4cg"]

[dependencies]
influxdb = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.18"
log = "0.4.32"
simple_logger = { version = "5.2.0", default-features = false, features = ["timestamps"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
num-traits = "0.2.19"
